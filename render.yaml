services:
  - type: web
    name: bench-django
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bench-django-db
          property: connectionString
databases:
  - name: bench-django-db
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
